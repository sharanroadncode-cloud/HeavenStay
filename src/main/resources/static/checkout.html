<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Haven Stay - Check Out</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #F5F1E8; color: #2B2B2B; font-family: Arial, sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
        header { background: #1F3D36; padding: 20px 48px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.4rem; color: #C8A96A; font-family: Georgia, serif; }
        .back { font-size: 0.82rem; color: #a0b8a8; text-decoration: none; }
        .back:hover { color: #C8A96A; }
        main { flex: 1; display: flex; gap: 28px; padding: 40px 48px; flex-wrap: wrap; align-items: flex-start; }
        .form-box { background: #fff; border-radius: 4px; padding: 36px; width: 100%; max-width: 460px; border: 1px solid #e0d8c8; border-top: 4px solid #1F3D36; }
        .section-label { font-size: 0.7rem; color: #C8A96A; text-transform: uppercase; letter-spacing: 0.2em; margin-bottom: 8px; }
        .section-title { font-size: 1.7rem; color: #1F3D36; font-family: Georgia, serif; font-weight: normal; margin-bottom: 6px; }
        .section-sub { font-size: 0.82rem; color: #888; margin-bottom: 28px; }
        .gold-line { width: 36px; height: 2px; background: #C8A96A; margin-bottom: 28px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-size: 0.72rem; font-weight: bold; color: #1F3D36; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.08em; }
        input { width: 100%; padding: 11px 14px; border: 1px solid #d0c8b8; border-radius: 3px; font-size: 0.88rem; color: #2B2B2B; background: #fdfcf9; outline: none; }
        input:focus { border-color: #1F3D36; background: #fff; }
        .bill-box { background: #F5F1E8; border: 1px solid #e0d8c8; border-radius: 3px; padding: 16px; margin-bottom: 18px; }
        .bill-title { font-size: 0.68rem; color: #888; text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 12px; }
        .bill-row { display: flex; justify-content: space-between; font-size: 0.84rem; padding: 5px 0; border-bottom: 1px solid #e8e0d0; }
        .bill-row:last-child { border-bottom: none; font-weight: bold; padding-top: 10px; font-size: 1rem; }
        .bill-row span:first-child { color: #666; }
        .bill-row:last-child span:first-child { color: #1F3D36; }
        .bill-total { color: #C8A96A !important; }
        .btn { width: 100%; padding: 13px; background: #1F3D36; color: #C8A96A; border: none; border-radius: 3px; font-size: 0.85rem; letter-spacing: 0.08em; cursor: pointer; margin-top: 8px; font-family: Arial, sans-serif; }
        .btn:hover { background: #162d28; }
        .btn:disabled { background: #aaa; color: #fff; cursor: not-allowed; }
        .msg { margin-top: 18px; padding: 12px 16px; border-radius: 3px; font-size: 0.83rem; display: none; }
        .msg.success { display: block; background: #edf7f2; border-left: 3px solid #1F3D36; color: #1F3D36; }
        .msg.error { display: block; background: #fdf2f2; border-left: 3px solid #c0392b; color: #c0392b; }
        .recent-box { background: #fff; border-radius: 4px; padding: 28px; width: 100%; max-width: 460px; border: 1px solid #e0d8c8; }
        .recent-title { font-size: 0.7rem; color: #888; text-transform: uppercase; letter-spacing: 0.15em; margin-bottom: 16px; border-bottom: 1px solid #f0e8d8; padding-bottom: 10px; }
        .record-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #f5f0e8; }
        .record-item:last-child { border-bottom: none; }
        .record-id { font-size: 0.78rem; font-weight: bold; color: #1F3D36; }
        .record-info { font-size: 0.72rem; color: #888; margin-top: 2px; }
        .amount-tag { background: #edf7f2; border: 1px solid #1F3D36; color: #1F3D36; padding: 3px 10px; border-radius: 2px; font-size: 0.7rem; font-weight: bold; }
        footer { background: #1F3D36; color: #5a7a6a; padding: 14px 48px; display: flex; justify-content: space-between; font-size: 0.72rem; }
    </style>
</head>
<body>

<header>
    <div class="logo">Haven Stay</div>
    <a href="dashboard.html" class="back">← Back to Reception</a>
</header>

<main>
    <div class="form-box">
        <p class="section-label">Reception Desk</p>
        <h1 class="section-title">Guest Check-Out</h1>
        <p class="section-sub">Process guest departure and settle the final bill</p>
        <div class="gold-line"></div>

        <form id="checkoutForm" onsubmit="submitCheckOut(event)">
            <div class="form-row">
                <div class="form-group">
                    <label for="bookingId">Booking ID</label>
                    <input type="text" id="bookingId" placeholder="e.g. BK001" required/>
                </div>
                <div class="form-group">
                    <label for="guestId">Guest ID</label>
                    <input type="text" id="guestId" placeholder="e.g. G001" required/>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="staffId">Staff ID</label>
                    <input type="text" id="staffId" placeholder="e.g. S001" required/>
                </div>
                <div class="form-group">
                    <label for="extraCharges">Extra Charges (LKR)</label>
                    <input type="number" id="extraCharges" placeholder="0.00" min="0" step="0.01" value="0" oninput="updateBill()"/>
                </div>
            </div>

            <div class="bill-box">
                <div class="bill-title">Bill Summary</div>
                <div class="bill-row"><span>Base Room Rate</span><span>LKR 15,000.00</span></div>
                <div class="bill-row"><span>Extra Charges</span><span id="previewExtra">LKR 0.00</span></div>
                <div class="bill-row"><span>Total Bill</span><span class="bill-total" id="previewTotal">LKR 15,000.00</span></div>
            </div>

            <button type="submit" class="btn" id="submitBtn">Confirm Check-Out & Settle Bill</button>
        </form>

        <div class="msg" id="msg"></div>
    </div>

    <div class="recent-box">
        <div class="recent-title">Recent Check-Outs</div>
        <div id="recentList"><p style="color:#bbb;font-size:0.82rem">Loading...</p></div>
    </div>
</main>

<footer>
    <span>© 2024 Haven Stay Hotel</span>
    <span>Reception Management System</span>
</footer>

<script>
    const BASE = 15000;

    function updateBill() {
        const extra = parseFloat(document.getElementById('extraCharges').value) || 0;
        document.getElementById('previewExtra').textContent = 'LKR ' + extra.toFixed(2);
        document.getElementById('previewTotal').textContent = 'LKR ' + (BASE + extra).toFixed(2);
    }

    async function submitCheckOut(e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        const msg = document.getElementById('msg');
        btn.disabled = true;
        btn.textContent = 'Processing...';
        msg.className = 'msg';

        const payload = {
            bookingId: document.getElementById('bookingId').value.trim(),
            guestId: document.getElementById('guestId').value.trim(),
            staffId: document.getElementById('staffId').value.trim(),
            extraCharges: parseFloat(document.getElementById('extraCharges').value) || 0
        };

        try {
            const res = await fetch('http://localhost:8080/checkout', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            if (data.success) {
                msg.className = 'msg success';
                msg.textContent = 'Check-out successful! ID: ' + data.data.checkOutId + ' | Total: LKR ' + data.data.totalBill.toFixed(2);
                document.getElementById('checkoutForm').reset();
                updateBill();
                loadRecent();
            } else {
                msg.className = 'msg error';
                msg.textContent = data.message;
            }
        } catch {
            msg.className = 'msg error';
            msg.textContent = 'Cannot connect to server. Make sure Spring Boot is running on port 8080.';
        }

        btn.disabled = false;
        btn.textContent = 'Confirm Check-Out & Settle Bill';
    }

    async function loadRecent() {
        try {
            const res = await fetch('http://localhost:8080/checkout');
            const data = await res.json();
            const list = document.getElementById('recentList');
            const rows = (data.data || []).reverse().slice(0, 5);
            if (rows.length === 0) { list.innerHTML = '<p style="color:#bbb;font-size:0.82rem">No check-outs yet.</p>'; return; }
            list.innerHTML = rows.map(co => `
                <div class="record-item">
                    <div>
                        <div class="record-id">${co.checkOutId}</div>
                        <div class="record-info">Guest: ${co.guestId} &nbsp;·&nbsp; ${co.departureTime}</div>
                    </div>
                    <div class="amount-tag">LKR ${co.totalBill.toFixed(2)}</div>
                </div>`).join('');
        } catch {
            document.getElementById('recentList').innerHTML = '<p style="color:#bbb;font-size:0.82rem">Server offline.</p>';
        }
    }

    loadRecent();
</script>

</body>
</html>
