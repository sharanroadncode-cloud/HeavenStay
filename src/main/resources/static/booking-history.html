<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Booking History – Heaven Stay</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root { --primary:#1F3D36; --secondary:#F5F1E8; --accent:#C8A96A; --text:#2B2B2B; --white:#FFFFFF; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Inter',sans-serif; color:var(--text); background:var(--secondary); }

    nav { background:var(--primary); display:flex; align-items:center; justify-content:space-between; padding:0 48px; height:70px; position:sticky; top:0; z-index:100; box-shadow:0 2px 12px rgba(0,0,0,.3); }
    .logo { display:flex; align-items:center; gap:10px; text-decoration:none; }
    .logo-icon { width:38px; height:38px; background:var(--accent); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:18px; }
    .logo-text { font-family:'Playfair Display',serif; color:var(--white); font-size:22px; font-weight:700; }
    .logo-text span { color:var(--accent); }
    nav ul { list-style:none; display:flex; gap:32px; }
    nav ul a { color:rgba(255,255,255,.85); text-decoration:none; font-size:14px; font-weight:500; transition:.2s; }
    nav ul a:hover, nav ul a.active { color:var(--accent); }

    .page-header { background:linear-gradient(135deg,var(--primary),#2d5a4e); padding:60px 48px 40px; color:var(--white); }
    .breadcrumb { font-size:13px; color:rgba(255,255,255,.6); margin-bottom:12px; }
    .breadcrumb a { color:var(--accent); text-decoration:none; }
    .page-header h1 { font-family:'Playfair Display',serif; font-size:38px; margin-bottom:8px; }
    .page-header p { color:rgba(255,255,255,.75); font-size:16px; }

    .container { max-width:1100px; margin:40px auto; padding:0 24px 80px; }

    /* FILTERS */
    .filters { background:var(--white); border-radius:16px; padding:24px 28px; margin-bottom:28px; display:flex; gap:16px; align-items:center; flex-wrap:wrap; border:1px solid #ede9de; box-shadow:0 2px 12px rgba(0,0,0,.04); }
    .filter-group { display:flex; flex-direction:column; gap:5px; }
    .filter-group label { font-size:11px; font-weight:600; color:var(--primary); letter-spacing:.6px; text-transform:uppercase; }
    .filter-group input, .filter-group select {
      padding:10px 14px; border:2px solid #e8e4d9; border-radius:8px; font-size:14px; background:var(--secondary); outline:none; transition:.2s; color:var(--text); min-width:140px;
    }
    .filter-group input:focus, .filter-group select:focus { border-color:var(--accent); }
    .filter-btn { background:var(--primary); color:var(--white); border:none; padding:11px 24px; border-radius:8px; font-size:14px; font-weight:600; cursor:pointer; margin-top:18px; transition:.2s; }
    .filter-btn:hover { background:var(--accent); }
    .filter-clear { background:transparent; color:#999; border:1px solid #ddd; padding:11px 20px; border-radius:8px; font-size:13px; cursor:pointer; margin-top:18px; transition:.2s; }
    .filter-clear:hover { color:var(--text); border-color:#aaa; }

    /* STATS */
    .stats-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:16px; margin-bottom:28px; }
    .stat-card { background:var(--white); border-radius:14px; padding:20px 24px; border:1px solid #ede9de; }
    .stat-card .num { font-size:30px; font-weight:700; color:var(--primary); }
    .stat-card .lbl { font-size:13px; color:#777; margin-top:4px; }
    .stat-card.accent .num { color:var(--accent); }

    /* TABLE */
    .table-card { background:var(--white); border-radius:16px; overflow:hidden; border:1px solid #ede9de; box-shadow:0 2px 16px rgba(0,0,0,.05); }
    .table-header { padding:20px 28px; display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid var(--secondary); }
    .table-header h3 { font-family:'Playfair Display',serif; color:var(--primary); font-size:18px; }
    .result-count { font-size:13px; color:#888; }
    table { width:100%; border-collapse:collapse; }
    thead th { background:var(--secondary); padding:14px 20px; text-align:left; font-size:12px; font-weight:700; color:var(--primary); letter-spacing:.6px; text-transform:uppercase; }
    tbody tr { border-bottom:1px solid #f0ece2; transition:.15s; }
    tbody tr:hover { background:#faf8f3; }
    tbody td { padding:16px 20px; font-size:14px; vertical-align:middle; }
    .booking-id { font-weight:700; color:var(--primary); font-family:monospace; font-size:13px; }
    .room-pill { display:inline-flex; align-items:center; gap:6px; background:var(--secondary); border-radius:6px; padding:4px 10px; font-size:13px; font-weight:500; }
    .status-pill { padding:5px 12px; border-radius:20px; font-size:12px; font-weight:600; display:inline-block; }
    .status-CONFIRMED { background:#d4edda; color:#155724; }
    .status-PENDING   { background:#fff3cd; color:#856404; }
    .status-CANCELLED { background:#f8d7da; color:#721c24; }
    .status-CHECKED_IN  { background:#d1ecf1; color:#0c5460; }
    .status-CHECKED_OUT { background:#e2e3e5; color:#383d41; }
    .actions { display:flex; gap:8px; }
    .action-btn { padding:7px 14px; border-radius:7px; font-size:12px; font-weight:600; cursor:pointer; transition:.2s; text-decoration:none; border:none; }
    .btn-view { background:var(--secondary); color:var(--primary); border:1px solid #ddd; }
    .btn-view:hover { background:var(--primary); color:var(--white); }
    .btn-pay { background:var(--accent); color:var(--white); }
    .btn-pay:hover { background:#b8955a; }
    .btn-cancel { background:#fee; color:#c0392b; border:1px solid #fcc; }
    .btn-cancel:hover { background:#c0392b; color:var(--white); }

    /* EMPTY STATE */
    .empty-state { padding:80px 40px; text-align:center; }
    .empty-state .icon { font-size:64px; margin-bottom:16px; }
    .empty-state h3 { font-family:'Playfair Display',serif; color:var(--primary); font-size:22px; margin-bottom:8px; }
    .empty-state p { color:#888; font-size:15px; }
    .empty-state a { display:inline-block; margin-top:20px; background:var(--primary); color:var(--white); padding:12px 28px; border-radius:10px; text-decoration:none; font-weight:600; }

    /* DETAIL MODAL */
    .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:1000; align-items:center; justify-content:center; padding:20px; }
    .modal-overlay.show { display:flex; }
    .modal { background:var(--white); border-radius:20px; padding:40px; max-width:520px; width:100%; box-shadow:0 20px 60px rgba(0,0,0,.2); max-height:90vh; overflow-y:auto; }
    .modal-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; }
    .modal-head h2 { font-family:'Playfair Display',serif; color:var(--primary); font-size:22px; }
    .close-btn { background:none; border:none; font-size:24px; cursor:pointer; color:#aaa; }
    .detail-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    .detail-item label { font-size:11px; font-weight:700; color:#888; letter-spacing:.6px; text-transform:uppercase; display:block; margin-bottom:4px; }
    .detail-item p { font-size:15px; font-weight:600; color:var(--text); }
    .detail-item.full { grid-column:1/-1; }

    .loading { text-align:center; padding:60px; color:#888; font-size:16px; }
    .spinner { width:40px; height:40px; border:4px solid #e8e4d9; border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; margin:0 auto 16px; }
    @keyframes spin { to { transform:rotate(360deg); } }

    @media(max-width:768px) {
      nav { padding:0 20px; } nav ul { display:none; }
      .page-header { padding:40px 20px 30px; }
      .container { padding:0 16px 60px; }
      table { display:block; overflow-x:auto; }
    }
  </style>
</head>
<body>

<nav>
  <a href="index.html" class="logo">
    <div class="logo-icon">🏨</div>
    <div class="logo-text">Heaven <span>Stay</span></div>
  </a>
  <ul>
    <li><a href="index.html">Home</a></li>
    <li><a href="booking.html">Book Now</a></li>
    <li><a href="booking-history.html" class="active">My Bookings</a></li>
    <li><a href="payment.html">Payment</a></li>
  </ul>
</nav>

<div class="page-header">
  <div class="breadcrumb"><a href="index.html">Home</a> › Booking History</div>
  <h1>My Reservations</h1>
  <p>View and manage all your booking history at Heaven Stay.</p>
</div>

<div class="container">

  <!-- STATS -->
  <div class="stats-row">
    <div class="stat-card"><div class="num" id="stat-total">—</div><div class="lbl">Total Bookings</div></div>
    <div class="stat-card"><div class="num" id="stat-confirmed">—</div><div class="lbl">Confirmed</div></div>
    <div class="stat-card accent"><div class="num" id="stat-pending">—</div><div class="lbl">Pending</div></div>
    <div class="stat-card"><div class="num" id="stat-cancelled">—</div><div class="lbl">Cancelled</div></div>
  </div>

  <!-- FILTERS -->
  <div class="filters">
    <div class="filter-group">
      <label>Search by ID</label>
      <input type="text" id="f-id" placeholder="BK-XXXXXX" oninput="applyFilters()"/>
    </div>
    <div class="filter-group">
      <label>Status</label>
      <select id="f-status" onchange="applyFilters()">
        <option value="">All Statuses</option>
        <option value="CONFIRMED">Confirmed</option>
        <option value="PENDING">Pending</option>
        <option value="CANCELLED">Cancelled</option>
        <option value="CHECKED_IN">Checked In</option>
        <option value="CHECKED_OUT">Checked Out</option>
      </select>
    </div>
    <div class="filter-group">
      <label>From</label>
      <input type="date" id="f-from" onchange="applyFilters()"/>
    </div>
    <div class="filter-group">
      <label>To</label>
      <input type="date" id="f-to" onchange="applyFilters()"/>
    </div>
    <button class="filter-clear" onclick="clearFilters()">✕ Clear</button>
  </div>

  <!-- TABLE -->
  <div class="table-card">
    <div class="table-header">
      <h3>Reservation Records</h3>
      <span class="result-count" id="resultCount">Loading…</span>
    </div>
    <div id="tableBody">
      <div class="loading"><div class="spinner"></div>Loading your bookings…</div>
    </div>
  </div>
</div>

<!-- DETAIL MODAL -->
<div class="modal-overlay" id="detailModal">
  <div class="modal">
    <div class="modal-head">
      <h2>Booking Details</h2>
      <button class="close-btn" onclick="closeModal()">✕</button>
    </div>
    <div id="detailContent"></div>
    <div style="display:flex;gap:12px;margin-top:24px;flex-wrap:wrap;">
      <a id="modal-pay-btn" href="#" class="action-btn btn-pay" style="padding:12px 24px;font-size:14px;">Pay Now</a>
      <button class="action-btn btn-cancel" style="padding:12px 20px;font-size:14px;" id="modal-cancel-btn">Cancel Booking</button>
      <button class="action-btn btn-view" style="padding:12px 20px;font-size:14px;" onclick="closeModal()">Close</button>
    </div>
  </div>
</div>

<script>
let allBookings = [];

const ROOM_NAMES = { 'R001':'Standard Room','R002':'Deluxe Room','R003':'Presidential Suite' };

// Demo data
const DEMO_BOOKINGS = [
  { bookingId:'BK-A1B2C3', guestId:'G001', roomId:'R002', checkInDate:'2026-05-10', checkOutDate:'2026-05-13', status:'CONFIRMED', numberOfGuests:2, specialRequests:'Sea view preferred', subtotal:75000, discount:3750, tax:7125, total:78375 },
  { bookingId:'BK-D4E5F6', guestId:'G001', roomId:'R001', checkInDate:'2026-04-01', checkOutDate:'2026-04-03', status:'CHECKED_OUT', numberOfGuests:1, specialRequests:'', subtotal:30000, discount:1500, tax:2850, total:31350 },
  { bookingId:'BK-G7H8I9', guestId:'G002', roomId:'R003', checkInDate:'2026-06-20', checkOutDate:'2026-06-23', status:'PENDING',   numberOfGuests:3, specialRequests:'Anniversary decoration', subtotal:150000, discount:7500, tax:14250, total:156750 },
];

function loadBookings() {
  fetch('http://localhost:8080/api/bookings')
    .then(r => r.json())
    .then(data => { allBookings = data; render(data); updateStats(data); })
    .catch(() => { allBookings = DEMO_BOOKINGS; render(DEMO_BOOKINGS); updateStats(DEMO_BOOKINGS); });
}

function updateStats(data) {
  document.getElementById('stat-total').textContent = data.length;
  document.getElementById('stat-confirmed').textContent = data.filter(b=>b.status==='CONFIRMED').length;
  document.getElementById('stat-pending').textContent = data.filter(b=>b.status==='PENDING').length;
  document.getElementById('stat-cancelled').textContent = data.filter(b=>b.status==='CANCELLED').length;
}

function render(data) {
  const body = document.getElementById('tableBody');
  document.getElementById('resultCount').textContent = data.length + ' record' + (data.length!==1?'s':'');
  if (!data.length) {
    body.innerHTML = `<div class="empty-state"><div class="icon">📋</div><h3>No bookings found</h3><p>No reservations match your filters.</p><a href="booking.html">Make a Reservation</a></div>`;
    return;
  }
  body.innerHTML = `<table>
    <thead><tr>
      <th>Booking ID</th><th>Room</th><th>Check-In</th><th>Check-Out</th>
      <th>Guests</th><th>Total</th><th>Status</th><th>Actions</th>
    </tr></thead>
    <tbody>${data.map(b=>`
      <tr>
        <td><span class="booking-id">${b.bookingId}</span></td>
        <td><span class="room-pill">${roomEmoji(b.roomId)} ${ROOM_NAMES[b.roomId]||b.roomId}</span></td>
        <td>${b.checkInDate}</td>
        <td>${b.checkOutDate}</td>
        <td>${b.numberOfGuests}</td>
        <td><strong>LKR ${parseFloat(b.total||0).toFixed(2)}</strong></td>
        <td><span class="status-pill status-${b.status}">${b.status.replace('_',' ')}</span></td>
        <td><div class="actions">
          <button class="action-btn btn-view" onclick="openDetail('${b.bookingId}')">View</button>
          ${b.status==='PENDING'||b.status==='CONFIRMED' ? `<a href="payment.html?bookingId=${b.bookingId}" class="action-btn btn-pay">Pay</a>` : ''}
          ${b.status!=='CANCELLED'&&b.status!=='CHECKED_OUT' ? `<button class="action-btn btn-cancel" onclick="cancelBooking('${b.bookingId}')">Cancel</button>` : ''}
        </div></td>
      </tr>`).join('')}
    </tbody>
  </table>`;
}

function roomEmoji(id) { return {R001:'🛏️',R002:'🏡',R003:'✨'}[id]||'🏨'; }

function openDetail(id) {
  const b = allBookings.find(x=>x.bookingId===id);
  if (!b) return;
  document.getElementById('detailContent').innerHTML = `
    <div class="detail-grid">
      <div class="detail-item"><label>Booking ID</label><p>${b.bookingId}</p></div>
      <div class="detail-item"><label>Status</label><p><span class="status-pill status-${b.status}">${b.status.replace('_',' ')}</span></p></div>
      <div class="detail-item"><label>Room</label><p>${roomEmoji(b.roomId)} ${ROOM_NAMES[b.roomId]||b.roomId}</p></div>
      <div class="detail-item"><label>Guests</label><p>${b.numberOfGuests}</p></div>
      <div class="detail-item"><label>Check-In</label><p>${b.checkInDate}</p></div>
      <div class="detail-item"><label>Check-Out</label><p>${b.checkOutDate}</p></div>
      <div class="detail-item"><label>Subtotal</label><p>LKR ${parseFloat(b.subtotal||0).toFixed(2)}</p></div>
      <div class="detail-item"><label>Discount</label><p>-LKR ${parseFloat(b.discount||0).toFixed(2)}</p></div>
      <div class="detail-item"><label>Tax</label><p>LKR ${parseFloat(b.tax||0).toFixed(2)}</p></div>
      <div class="detail-item"><label>Total</label><p style="color:var(--accent);font-size:20px">LKR ${parseFloat(b.total||0).toFixed(2)}</p></div>
      ${b.specialRequests?`<div class="detail-item full"><label>Special Requests</label><p>${b.specialRequests}</p></div>`:''}
    </div>`;
  document.getElementById('modal-pay-btn').href = 'payment.html?bookingId='+b.bookingId;
  document.getElementById('modal-cancel-btn').onclick = () => { closeModal(); cancelBooking(id); };
  document.getElementById('detailModal').classList.add('show');
}

function closeModal() { document.getElementById('detailModal').classList.remove('show'); }

function cancelBooking(id) {
  if (!confirm('Cancel booking ' + id + '? This cannot be undone.')) return;
  fetch(`http://localhost:8080/api/bookings/${id}/cancel`, {method:'PUT'})
    .then(r => r.json())
    .then(() => loadBookings())
    .catch(() => {
      const b = allBookings.find(x=>x.bookingId===id);
      if (b) { b.status='CANCELLED'; render(allBookings); updateStats(allBookings); }
    });
}

function applyFilters() {
  const id = document.getElementById('f-id').value.toLowerCase();
  const status = document.getElementById('f-status').value;
  const from = document.getElementById('f-from').value;
  const to = document.getElementById('f-to').value;
  const filtered = allBookings.filter(b => {
    if (id && !b.bookingId.toLowerCase().includes(id)) return false;
    if (status && b.status !== status) return false;
    if (from && b.checkInDate < from) return false;
    if (to && b.checkInDate > to) return false;
    return true;
  });
  render(filtered);
}

function clearFilters() {
  ['f-id','f-from','f-to'].forEach(id => document.getElementById(id).value='');
  document.getElementById('f-status').value='';
  render(allBookings);
}

loadBookings();
</script>
</body>
</html>
