<!DOCTYPE html>
<!--
  File : admin-login.html
  Path : src/main/resources/templates/admin-login.html
  Desc : Heaven Stay – Admin Login Page (Thymeleaf)
-->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Admin Login – Heaven Stay</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root{--p:#1F3D36;--s:#F5F1E8;--a:#C8A96A;--t:#2B2B2B;--w:#fff;--bd:#D6CFC0;--err:#B94A48;--ok:#2E7D52;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',sans-serif;background:var(--s);color:var(--t);min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
    .hero{background:var(--p);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 48px;position:relative;overflow:hidden}
    .hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 25% 75%,rgba(200,169,106,.18),transparent 65%)}
    .hero-inner{position:relative;z-index:1;text-align:center;max-width:340px}
    .h-logo{width:88px;height:88px;background:var(--a);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:40px;margin:0 auto 22px;box-shadow:0 8px 28px rgba(200,169,106,.35)}
    .hero h1{font-family:'Playfair Display',serif;color:#fff;font-size:2.3rem;line-height:1.2}
    .hero p{color:rgba(255,255,255,.6);font-size:.92rem;margin-top:14px;line-height:1.7}
    .gold-line{width:46px;height:3px;background:var(--a);border-radius:2px;margin:18px auto}
    .hero-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(200,169,106,.2);color:var(--a);border:1px solid rgba(200,169,106,.4);border-radius:20px;padding:5px 14px;font-size:.78rem;font-weight:600;margin-top:18px}
    .form-panel{background:#fff;display:flex;align-items:center;justify-content:center;padding:60px 48px}
    .form-wrap{width:100%;max-width:380px}
    .form-wrap h2{font-family:'Playfair Display',serif;color:var(--p);font-size:1.75rem}
    .form-wrap .sub{color:#888;font-size:.88rem;margin-top:4px;margin-bottom:28px}
    .alert{border-radius:8px;padding:11px 14px;font-size:.86rem;margin-bottom:18px;display:flex;align-items:center;gap:8px}
    .ae{background:#FDECEA;color:var(--err);border-left:4px solid var(--err)}
    .as{background:#E6F4ED;color:var(--ok);border-left:4px solid var(--ok)}
    .fg{margin-bottom:16px}
    .fg label{display:block;font-size:.79rem;font-weight:600;color:var(--p);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
    .fc{width:100%;padding:11px 14px;border:1.5px solid var(--bd);border-radius:8px;font-size:.94rem;font-family:'Inter',sans-serif;color:var(--t);background:#FAFAF8;outline:none;transition:border-color .2s,box-shadow .2s}
    .fc:focus{border-color:var(--p);background:#fff;box-shadow:0 0 0 3px rgba(31,61,54,.09)}
    .btn{width:100%;padding:12px;background:var(--p);color:#fff;border:none;border-radius:8px;font-size:.97rem;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;transition:background .2s}
    .btn:hover{background:#16302A}
    @media(max-width:680px){body{grid-template-columns:1fr}.hero{display:none}.form-panel{padding:48px 24px}}
  </style>
</head>
<body>
<div class="hero">
  <div class="hero-inner">
    <div class="h-logo">🏨</div>
    <div class="gold-line"></div>
    <h1>Heaven Stay</h1>
    <p>Admin Management Portal. Manage your hotel operations, staff accounts, reports and configuration.</p>
    <div class="hero-badge">🔐 Admin Access Only</div>
  </div>
</div>
<div class="form-panel">
  <div class="form-wrap">
    <h2>Admin Sign In</h2>
    <p class="sub">Enter your admin credentials to continue</p>
    <div th:if="${errorMsg}"  class="alert ae">⚠ <span th:text="${errorMsg}"></span></div>
    <div th:if="${logoutMsg}" class="alert as">✓ <span th:text="${logoutMsg}"></span></div>
    <form th:action="@{/admin/login}" method="post">
      <div class="fg"><label>Username</label>
        <input type="text" name="username" class="fc" placeholder="Admin username" autocomplete="username" required/></div>
      <div class="fg" style="margin-bottom:22px"><label>Password</label>
        <input type="password" name="password" class="fc" placeholder="Password" autocomplete="current-password" required/></div>
      <button type="submit" class="btn">Sign In to Dashboard</button>
    </form>
  </div>
</div>
</body>
</html>
