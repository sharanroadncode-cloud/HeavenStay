<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>SRH – Guest Check-Out</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600;700&family=Jost:wght@300;400;500&display=swap" rel="stylesheet"/>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --gold:  #c9a84c;
            --gold2: #e8d08a;
            --dark:  #0d0d0d;
            --dark2: #161616;
            --dark3: #1f1f1f;
            --cream: #f5f0e8;
            --muted: #888880;
            --green: #4caf82;
            --red:   #c9504c;
        }

        body {
            background: var(--dark);
            color: var(--cream);
            font-family: 'Jost', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 28px 60px;
            border-bottom: 1px solid #2a2a2a;
        }
        .logo-mark {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.1rem;
            letter-spacing: 0.35em;
            color: var(--gold);
            text-transform: uppercase;
        }
        .back-btn {
            font-size: 0.75rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--muted);
            text-decoration: none;
            transition: color 0.2s;
        }
        .back-btn:hover { color: var(--gold); }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 40px;
        }

        .form-container {
            width: 100%;
            max-width: 520px;
            animation: fadeUp 0.7s ease both;
        }

        .page-label {
            font-size: 0.7rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 12px;
        }
        .page-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 3rem;
            font-weight: 300;
            line-height: 1;
            margin-bottom: 8px;
        }
        .page-sub {
            font-size: 0.82rem;
            color: var(--muted);
            letter-spacing: 0.05em;
            margin-bottom: 40px;
        }
        .divider {
            width: 40px; height: 1px;
            background: linear-gradient(90deg, var(--gold), transparent);
            margin-bottom: 40px;
        }

        .form-group { margin-bottom: 28px; }
        label {
            display: block;
            font-size: 0.68rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 10px;
        }
        input {
            width: 100%;
            background: var(--dark2);
            border: 1px solid #2a2a2a;
            border-radius: 2px;
            padding: 14px 18px;
            color: var(--cream);
            font-family: 'Jost', sans-serif;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s, background 0.2s;
        }
        input::placeholder { color: #3a3a3a; }
        input:focus {
            border-color: var(--gold);
            background: var(--dark3);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        /* Bill preview */
        .bill-preview {
            background: var(--dark2);
            border: 1px solid #2a2a2a;
            border-radius: 2px;
            padding: 20px 24px;
            margin-bottom: 28px;
        }
        .bill-preview-title {
            font-size: 0.65rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 14px;
        }
        .bill-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.82rem;
            padding: 6px 0;
            border-bottom: 1px solid #1e1e1e;
        }
        .bill-row:last-child { border-bottom: none; }
        .bill-row.total {
            margin-top: 8px;
            padding-top: 12px;
            font-size: 1rem;
            color: var(--gold);
            font-family: 'Cormorant Garamond', serif;
        }
        .bill-label { color: var(--muted); }

        .btn-submit {
            width: 100%;
            margin-top: 12px;
            padding: 16px;
            background: transparent;
            border: 1px solid var(--gold);
            border-radius: 2px;
            color: var(--gold);
            font-family: 'Jost', sans-serif;
            font-size: 0.8rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.25s, color 0.25s;
        }
        .btn-submit:hover { background: var(--gold); color: var(--dark); }
        .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

        .response-box {
            margin-top: 28px;
            padding: 20px 24px;
            border-radius: 2px;
            font-size: 0.85rem;
            line-height: 1.6;
            display: none;
            animation: fadeIn 0.4s ease;
        }
        .response-box.success {
            display: block;
            background: #0d1f17;
            border: 1px solid #1e4d33;
            color: var(--green);
        }
        .response-box.error {
            display: block;
            background: #1f0d0d;
            border: 1px solid #4d1e1e;
            color: var(--red);
        }
        .res-label { font-size: 0.65rem; letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 8px; opacity: 0.7; }
        .res-detail { margin-top: 10px; font-size: 0.8rem; opacity: 0.8; }
        .res-detail span { color: var(--gold2); }

        .recent-section { margin-top: 48px; border-top: 1px solid #1e1e1e; padding-top: 32px; }
        .recent-title { font-size: 0.68rem; letter-spacing: 0.25em; text-transform: uppercase; color: var(--muted); margin-bottom: 16px; }
        .record-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #1a1a1a;
            font-size: 0.82rem;
        }
        .record-id { color: var(--gold); font-size: 0.75rem; }
        .record-amount {
            background: #1f1f1f;
            border: 1px solid #2a2a2a;
            padding: 3px 10px;
            border-radius: 2px;
            font-size: 0.72rem;
            letter-spacing: 0.05em;
            color: var(--gold2);
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }
    </style>
</head>
<body>

<header>
    <div class="logo-mark">SRH &nbsp;·&nbsp; Check-Out</div>
    <a href="dashboard.html" class="back-btn">← Dashboard</a>
</header>

<main>
    <div class="form-container">
        <p class="page-label">Reception Desk</p>
        <h1 class="page-title">Guest Check-Out</h1>
        <p class="page-sub">Process departure and settle the final bill</p>
        <div class="divider"></div>

        <form id="checkoutForm" onsubmit="submitCheckOut(event)">

            <div class="form-row">
                <div class="form-group">
                    <label for="bookingId">Booking ID</label>
                    <input type="text" id="bookingId" placeholder="e.g. BK001" required/>
                </div>
                <div class="form-group">
                    <label for="guestId">Guest ID</label>
                    <input type="text" id="guestId" placeholder="e.g. G001" required/>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="staffId">Staff ID</label>
                    <input type="text" id="staffId" placeholder="e.g. S001" required/>
                </div>
                <div class="form-group">
                    <label for="outstandingCharges">Outstanding Charges (LKR)</label>
                    <input type="number" id="outstandingCharges" placeholder="0.00"
                           min="0" step="0.01" value="0" oninput="updateBill()"/>
                </div>
            </div>

            <!-- Live bill preview -->
            <div class="bill-preview">
                <div class="bill-preview-title">Bill Summary</div>
                <div class="bill-row">
                    <span class="bill-label">Base Room Rate</span>
                    <span>LKR 15,000.00</span>
                </div>
                <div class="bill-row">
                    <span class="bill-label">Outstanding Charges</span>
                    <span id="previewCharges">LKR 0.00</span>
                </div>
                <div class="bill-row total">
                    <span>Final Total</span>
                    <span id="previewTotal">LKR 15,000.00</span>
                </div>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">
                Confirm Check-Out &amp; Settle Bill
            </button>
        </form>

        <div class="response-box" id="responseBox">
            <div class="res-label" id="resLabel"></div>
            <div id="resMessage"></div>
            <div class="res-detail" id="resDetail"></div>
        </div>

        <div class="recent-section">
            <div class="recent-title">Recent Check-Outs</div>
            <div id="recentList"><p style="color:#444;font-size:0.8rem;">Loading...</p></div>
        </div>
    </div>
</main>

<script>
    const API        = 'http://localhost:8080/checkout';
    const BASE_RATE  = 15000;

    function updateBill() {
        const charges = parseFloat(document.getElementById('outstandingCharges').value) || 0;
        const total   = BASE_RATE + charges;
        document.getElementById('previewCharges').textContent = 'LKR ' + charges.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        document.getElementById('previewTotal').textContent   = 'LKR ' + total.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    }

    async function submitCheckOut(e) {
        e.preventDefault();

        const btn = document.getElementById('submitBtn');
        btn.disabled    = true;
        btn.textContent = 'Processing...';

        const payload = {
            bookingId:          document.getElementById('bookingId').value.trim(),
            guestId:            document.getElementById('guestId').value.trim(),
            staffId:            document.getElementById('staffId').value.trim(),
            outstandingCharges: parseFloat(document.getElementById('outstandingCharges').value) || 0
        };

        try {
            const res  = await fetch(API, {
                method:  'POST',
                headers: { 'Content-Type': 'application/json' },
                body:    JSON.stringify(payload)
            });
            const data = await res.json();
            showResponse(data.success, data.message, data.data);
            if (data.success) {
                document.getElementById('checkoutForm').reset();
                updateBill();
                loadRecent();
            }
        } catch (err) {
            showResponse(false, 'Cannot connect to server. Make sure Spring Boot is running on port 8080.', null);
        } finally {
            btn.disabled    = false;
            btn.textContent = 'Confirm Check-Out & Settle Bill';
        }
    }

    function showResponse(success, message, data) {
        const box = document.getElementById('responseBox');
        box.className = 'response-box ' + (success ? 'success' : 'error');
        document.getElementById('resLabel').textContent   = success ? '✓ Success' : '✗ Error';
        document.getElementById('resMessage').textContent = message;

        const detail = document.getElementById('resDetail');
        if (success && data) {
            detail.innerHTML =
                `Check-Out ID: <span>${data.checkOutId}</span> &nbsp;|&nbsp; ` +
                `Final Bill: <span>LKR ${data.finalTotal.toFixed(2)}</span>`;
        } else {
            detail.innerHTML = '';
        }
    }

    async function loadRecent() {
        try {
            const res  = await fetch(API);
            const data = await res.json();
            const list = document.getElementById('recentList');

            if (!data.data || data.data.length === 0) {
                list.innerHTML = '<p style="color:#444;font-size:0.8rem;">No check-outs yet.</p>';
                return;
            }

            const recent = [...data.data].reverse().slice(0, 5);
            list.innerHTML = recent.map(co => `
                <div class="record-item">
                    <div>
                        <div class="record-id">${co.checkOutId}</div>
                        <div style="color:#666;font-size:0.75rem;margin-top:2px;">
                            Guest: ${co.guestId} &nbsp;·&nbsp; ${co.actualDeparture}
                        </div>
                    </div>
                    <div class="record-amount">LKR ${co.finalTotal.toFixed(2)}</div>
                </div>
            `).join('');
        } catch {
            document.getElementById('recentList').innerHTML =
                '<p style="color:#444;font-size:0.8rem;">Server offline.</p>';
        }
    }

    loadRecent();
</script>

</body>
</html>
